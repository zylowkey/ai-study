server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: spring-ai-pg
  data:
    redis:
      host: 172.31.101.238
      port: 6379
      password: 123456
      database: 0
  datasource:
    url: jdbc:mysql://192.168.31.25:3306/jc-ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  ai:
    openai:
      # 如果用 DeepSeek，改成 https://api.deepseek.com
      # 如果用 OpenAI，改成 https://api.openai.com（或者不填，默认就是这个）
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}   # 从环境变量读取，不要直接写在配置文件里
      chat:
        options:
          model: deepseek-v4-pro        # DeepSeek-V4 的模型名
          temperature: 0.7            # 创意度，0-2，越高越随机
#          max-tokens: 2048            # 最大输出 Token 数
logging:
  level:
    org.springframework.ai.chat.client.advisor: debug
#          top-p: 1.0                  # 核采样参数